name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Typecheck sources
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build

      - name: Typecheck tests
        run: pnpm typecheck:tests

      - name: Run fast targeted tests (push to main)
        if: github.event_name == 'push'
        run: pnpm test run-tests-filter fsm actors errors

      - name: Run full deterministic tests (pull_request & manual dispatch)
        if: github.event_name != 'push'
        run: pnpm test
